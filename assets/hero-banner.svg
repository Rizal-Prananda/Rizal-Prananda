<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="termGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Terminal background -->
  <rect width="1200" height="280" fill="url(#termBg)"/>
  <rect width="1200" height="280" fill="url(#scanlines)" opacity="0.3"/>
  
  <!-- Window chrome -->
  <rect x="40" y="20" width="1120" height="240" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="20" width="1120" height="36" rx="8" fill="#21262d"/>
  <rect x="40" y="20" width="1120" height="36" fill="url(#scanlines)" opacity="0.1" rx="8"/>
  
  <!-- Traffic lights -->
  <circle cx="70" cy="38" r="7" fill="#ff5f57"/>
  <circle cx="94" cy="38" r="7" fill="#ffbd2e"/>
  <circle cx="118" cy="38" r="7" fill="#28ca42"/>
  
  <!-- Window title -->
  <text x="180" y="43" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="13" font-weight="500" fill="#8b949e">rizal@oetomo ~ </text>
  <text x="310" y="43" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="13" font-weight="500" fill="#58a6ff">$ cat profile.md</text>
  
  <!-- Cursor blink -->
  <rect x="460" y="30" width="10" height="20" fill="#58a6ff" opacity="0.8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Output lines -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="14" fill="#e6edf3">
    <!-- Header -->
    <text x="70" y="85" fill="url(#accentBlue)" font-weight="700" font-size="28" letter-spacing="-0.5px">Rizal Prananda</text>
    
    <!-- Divider -->
    <text x="70" y="112" fill="#30363d" font-size="12">─────────────────────────────────────────────────────────────────────────────</text>
    
    <!-- Role tags -->
    <text x="70" y="140" fill="#8b949e" font-size="13">IT System Analyst</text>
    <text x="230" y="140" fill="url(#accentBlue)" font-size="13" font-weight="600">Backend Developer</text>
    <text x="430" y="140" fill="url(#accentGreen)" font-size="13" font-weight="600">Hospital Information Systems</text>
    
    <!-- Company/Location -->
    <text x="70" y="168" fill="#6e7681" font-size="13">Oetomo Hospital  •  Bandung, Indonesia</text>
    
    <!-- Divider -->
    <text x="70" y="192" fill="#30363d" font-size="12">─────────────────────────────────────────────────────────────────────────────</text>
    
    <!-- Status line -->
    <text x="70" y="220" fill="#58a6ff" font-size="13">▶  Building ecommerce-vfull (Laravel 13 + Astro 6 + Prisma)</text>
    <text x="70" y="242" fill="#58a6ff" font-size="13">▶  Modernizing healthcare IT infrastructure</text>
  </g>
  
  <!-- Right side status badges -->
  <g transform="translate(850, 85)">
    <rect x="0" y="0" width="280" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="140" y="20" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#58a6ff" text-anchor="middle">PONYTAIL MODE: ULTRA</text>
  </g>
  
  <g transform="translate(850, 130)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
    <text x="65" y="16" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="600" fill="#3b82f6" text-anchor="middle">Laravel 13.x</text>
  </g>
  <g transform="translate(990, 130)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
    <text x="65" y="16" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="600" fill="#06b6d4" text-anchor="middle">Astro 6.x</text>
  </g>
  <g transform="translate(850, 165)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.8"/>
    <text x="65" y="16" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle">PHP 8.3</text>
  </g>
  <g transform="translate(990, 165)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <text x="65" y="16" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="600" fill="#f59e0b" text-anchor="middle">TypeScript 5.x</text>
  </g>
  
  <!-- Bottom prompt -->
  <text x="70" y="268" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e">rizal@oetomo ~ </text>
  <text x="195" y="268" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#58a6ff">$ _</text>
  <rect x="215" y="256" width="10" height="20" fill="#58a6ff" opacity="0.8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>